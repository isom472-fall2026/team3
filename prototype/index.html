<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KU Move — Kuwait University Bus System</title>
    <style>
        :root {
            --ku-blue-dark: #002b5b;
            --ku-blue-primary: #004b93;
            --ku-blue-light: #e8f1fb;
            --ku-yellow: #f59e0b;
            --ku-yellow-light: #fef3c7;
            --white: #ffffff;
            --gray-bg: #f8fafc;
            --gray-border: #e2e8f0;
            --gray-text: #64748b;
            --gray-dark: #1e293b;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--gray-bg);
            color: var(--gray-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
        }

        /* Mobile-first App Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 43, 91, 0.08);
            position: relative;
        }

        /* Header with Kuwait University Logo */
        header {
            background: linear-gradient(135deg, var(--ku-blue-dark) 0%, var(--ku-blue-primary) 100%);
            color: var(--white);
            padding: 18px 20px 14px;
            border-bottom: 4px solid var(--ku-yellow);
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ku-logo-svg {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
        }

        .header-titles h1 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.2px;
            line-height: 1.2;
        }

        .header-titles p {
            font-size: 12px;
            color: var(--ku-yellow-light);
            font-weight: 500;
            margin-top: 2px;
        }

        /* Campus Mode Switcher Tabs */
        .tab-switch {
            display: flex;
            background: var(--ku-blue-light);
            padding: 5px;
            margin: 16px 16px 10px;
            border-radius: 12px;
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ku-blue-primary);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--white);
            color: var(--ku-blue-dark);
            box-shadow: 0 2px 6px rgba(0, 43, 91, 0.12);
            border-left: 3px solid var(--ku-yellow);
        }

        /* Route Selection Dropdown / Selector */
        .route-selector-box {
            padding: 0 16px 12px;
        }

        .route-selector-box label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        select.route-dropdown {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid var(--gray-border);
            font-size: 14px;
            font-weight: 600;
            color: var(--ku-blue-dark);
            background-color: var(--white);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select.route-dropdown:focus {
            border-color: var(--ku-blue-primary);
        }

        /* Live Status Banner */
        .status-card {
            margin: 0 16px 16px;
            background: #f0f7ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }

            70% {
                box-shadow: 0 0 0 7px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        .status-text h4 {
            font-size: 13px;
            font-weight: 700;
            color: var(--ku-blue-dark);
        }

        .status-text p {
            font-size: 11px;
            color: var(--gray-text);
        }

        .eta-badge {
            background: var(--ku-yellow);
            color: var(--ku-blue-dark);
            font-weight: 800;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 8px;
            white-space: nowrap;
        }

        /* Timeline / Route Stops */
        .timeline-container {
            flex: 1;
            padding: 4px 20px 24px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--ku-blue-primary);
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stop-timeline {
            position: relative;
            padding-left: 28px;
        }

        .stop-timeline::before {
            content: "";
            position: absolute;
            top: 14px;
            bottom: 24px;
            left: 9px;
            width: 3px;
            background: #cbd5e1;
            border-radius: 2px;
        }

        .timeline-node {
            position: relative;
            margin-bottom: 22px;
        }

        .timeline-node:last-child {
            margin-bottom: 0;
        }

        .node-pin {
            position: absolute;
            left: -28px;
            top: 2px;
            width: 21px;
            height: 21px;
            border-radius: 50%;
            background: var(--white);
            border: 3px solid var(--ku-blue-primary);
            z-index: 2;
        }

        .node-pin.active {
            border-color: var(--ku-yellow);
            background: var(--ku-blue-dark);
            box-shadow: 0 0 0 4px var(--ku-yellow-light);
        }

        .stop-card {
            background: var(--white);
            border: 1px solid var(--gray-border);
            border-radius: 10px;
            padding: 10px 12px;
            transition: all 0.2s ease;
        }

        .stop-card.highlight {
            border-color: var(--ku-blue-primary);
            background: #fcfdfe;
        }

        .stop-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--ku-blue-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stop-details {
            font-size: 11px;
            color: var(--gray-text);
            margin-top: 3px;
            display: flex;
            justify-content: space-between;
        }

        .live-tag {
            font-size: 10px;
            font-weight: 700;
            background: var(--ku-yellow-light);
            color: #92400e;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Bus Visual Marker along timeline */
        .bus-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--ku-blue-dark);
            color: var(--white);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 6px;
        }

        /* Footer Navigation */
        footer {
            background: var(--white);
            border-top: 1px solid var(--gray-border);
            padding: 12px 20px;
            text-align: center;
            font-size: 11px;
            color: var(--gray-text);
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Header with Kuwait University Branding -->
        <header>
            <div class="header-top">
                <!-- Crisp Vector Emblem of Kuwait University -->
                <svg class="ku-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
                    <circle cx="50" cy="50" r="42" fill="#002b5b" />
                    <!-- Sun / Light of Knowledge -->
                    <path
                        d="M50 22L52 28L58 24L55 30L62 30L57 34L63 37L56 39L60 44L53 43L55 49L49 46L47 52L44 46L39 50L41 44L35 44L39 39L33 37L39 34L35 30L41 30L39 24L45 28Z"
                        fill="#f59e0b" opacity="0.9" />
                    <!-- Kuwait Traditional Dhow (Ship) Hull -->
                    <path d="M28 58C36 67 64 67 72 58C69 64 58 68 50 68C42 68 31 64 28 58Z" fill="#ffffff" />
                    <path d="M30 58H70L65 64H35L30 58Z" fill="#f59e0b" />
                    <!-- Dhow Mast & Sail -->
                    <path d="M48 38V58H51V38H48Z" fill="#ffffff" />
                    <path d="M51 40L68 56H51V40Z" fill="#ffffff" opacity="0.95" />
                    <!-- Year 1966 -->
                    <text x="50" y="80" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="bold"
                        font-family="Arial">1966</text>
                </svg>

                <div class="header-titles">
                    <h1>جامعة الكويت | Kuwait University</h1>
                    <p>Campus Shuttle Transit • KU Move</p>
                </div>
            </div>
        </header>

        <!-- Campus Mode Switcher (Inside vs Outside) -->
        <div class="tab-switch">
            <button class="tab-btn active" id="tab-inside" onclick="switchMode('inside')">
                🏫 Inside Campus
            </button>
            <button class="tab-btn" id="tab-outside" onclick="switchMode('outside')">
                🚌 Outside Campus (Jabriya)
            </button>
        </div>

        <!-- Route Selector -->
        <div class="route-selector-box">
            <label id="route-label">Select Active Route</label>
            <select class="route-dropdown" id="routeSelect" onchange="renderActiveRoute()">
                <!-- Options populated dynamically -->
            </select>
        </div>

        <!-- Live ETA Summary Banner -->
        <div class="status-card">
            <div class="status-info">
                <div class="pulse-dot"></div>
                <div class="status-text">
                    <h4 id="liveRouteStatus">Next Bus: On Schedule</h4>
                    <p id="liveStopTarget">Approaching Faculty of Medicine</p>
                </div>
            </div>
            <div class="eta-badge" id="etaBadge">4 Mins Away</div>
        </div>

        <!-- Route Stops Timeline -->
        <div class="timeline-container">
            <div class="section-title">
                <span>Route Stops & Live Progress</span>
                <span style="font-size: 11px; color: var(--gray-text); font-weight: normal;">No reservation
                    required</span>
            </div>

            <div class="stop-timeline" id="stopsList">
                <!-- Stops rendered dynamically -->
            </div>
        </div>

        <!-- Simple Student Footer -->
        <footer>
            Kuwait University Transportation & Operations • Sabah Al-Salem University City
        </footer>
    </div>

    <script>
        // Route Data definitions (Inside Shadadiya Campus & Outside to Jabriya Medical Center)
        const routesData = {
            inside: [
                {
                    id: "in-1",
                    name: "Campus Loop A (Science & Engineering)",
                    nextArrival: "3 Mins Away",
                    currentBusStopIndex: 1,
                    stops: [
                        { name: "Central Administration Gate", type: "Main Terminal", est: "Departs every 10m" },
                        { name: "College of Engineering & Petroleum", type: "North Zone", est: "Arriving now" },
                        { name: "College of Science (South)", type: "Central Zone", est: "4 mins" },
                        { name: "College of Business Administration (CBA)", type: "West Zone", est: "8 mins" },
                        { name: "Student Activities Hub", type: "Recreation", est: "12 mins" }
                    ]
                },
                {
                    id: "in-2",
                    name: "Campus Loop B (Arts, Life Sci & Education)",
                    nextArrival: "7 Mins Away",
                    currentBusStopIndex: 0,
                    stops: [
                        { name: "Main Metro/Bus Terminal", type: "Terminal", est: "Departs every 15m" },
                        { name: "College of Arts", type: "East Zone", est: "5 mins" },
                        { name: "College of Education", type: "East Zone", est: "9 mins" },
                        { name: "College of Life Sciences", type: "North Zone", est: "14 mins" }
                    ]
                }
            ],
            outside: [
                {
                    id: "out-1",
                    name: "Jabriya Express (Health Sciences Center ⇄ Shadadiya)",
                    nextArrival: "4 Mins Away",
                    currentBusStopIndex: 0,
                    stops: [
                        {
                            name: "Faculty of Medicine & Dentistry (Jabriya)",
                            type: "HSC Campus Main Gate",
                            est: "Departs: 08:00 AM (4m away)"
                        },
                        {
                            name: "Faculty of Pharmacy & Allied Health (Jabriya)",
                            type: "HSC Campus Bus Bay",
                            est: "Est: 08:08 AM"
                        },
                        {
                            name: "Highway 5 Express Transit Stop",
                            type: "Inter-Campus Corridor",
                            est: "Est: 08:22 AM"
                        },
                        {
                            name: "Sabah Al-Salem University City (Shadadiya)",
                            type: "Central Station Terminal",
                            est: "Est: 08:35 AM"
                        }
                    ]
                },
                {
                    id: "out-2",
                    name: "Shuwaikh & Khaldiya Connector",
                    nextArrival: "11 Mins Away",
                    currentBusStopIndex: 1,
                    stops: [
                        { name: "Khaldiya Campus Gate 3", type: "Satellite Campus", est: "Departs every 30m" },
                        { name: "Shuwaikh Campus Administration", type: "Satellite Campus", est: "11 mins" },
                        { name: "Sabah Al-Salem University City (Shadadiya)", type: "Main Terminal", est: "32 mins" }
                    ]
                }
            ]
        };

        let currentMode = "outside"; // default to outside as requested in user prompt (Jabriya HSC)

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById("tab-inside").classList.toggle("active", mode === "inside");
            document.getElementById("tab-outside").classList.toggle("active", mode === "outside");

            const select = document.getElementById("routeSelect");
            select.innerHTML = "";

            routesData[mode].forEach((route, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = route.name;
                select.appendChild(opt);
            });

            renderActiveRoute();
        }

        function renderActiveRoute() {
            const select = document.getElementById("routeSelect");
            const selectedIndex = parseInt(select.value, 10) || 0;
            const activeRoute = routesData[currentMode][selectedIndex];

            // Update Top Status Card
            document.getElementById("etaBadge").textContent = activeRoute.nextArrival;
            const activeStop = activeRoute.stops[activeRoute.currentBusStopIndex];
            document.getElementById("liveStopTarget").textContent = "Approaching: " + activeStop.name;
            document.getElementById("liveRouteStatus").textContent = "Next Bus: Active on Route";

            // Render Stops Timeline
            const stopsContainer = document.getElementById("stopsList");
            stopsContainer.innerHTML = "";

            activeRoute.stops.forEach((stop, i) => {
                const isCurrent = i === activeRoute.currentBusStopIndex;

                const node = document.createElement("div");
                node.className = "timeline-node";

                node.innerHTML = `
          <div class="node-pin ${isCurrent ? "active" : ""}"></div>
          <div class="stop-card ${isCurrent ? "highlight" : ""}">
            <div class="stop-name">
              <span>${stop.name}</span>
              ${isCurrent ? `<span class="live-tag">NEXT STOP</span>` : ""}
            </div>
            <div class="stop-details">
              <span>${stop.type}</span>
              <span style="font-weight: 600; color: ${isCurrent ? "var(--ku-blue-primary)" : "var(--gray-text)"}">${stop.est}</span>
            </div>
            ${isCurrent ? `
              <div class="bus-indicator">
                🚍 Bus #12 En Route (${activeRoute.nextArrival})
              </div>
            ` : ""}
          </div>
        `;
                stopsContainer.appendChild(node);
            });
        }

        // Initialize with Outside Campus view
        switchMode("outside");
    </script>
</body>

</html>
